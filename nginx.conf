server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Python SDK 仅通过同源接口访问，不直接发布容器端口。
    location /sdk-api/ {
        client_max_body_size 100m;
        error_page 413 = @sdk_upload_too_large;
        # 延迟解析，独立运行静态前端镜像时不依赖 SDK 容器存在。
        resolver 127.0.0.11;
        set $sdk_upstream http://canvas-sdk:8000;
        rewrite ^/sdk-api/(.*)$ /$1 break;
        proxy_pass $sdk_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location @sdk_upload_too_large {
        default_type application/json;
        return 413 '{"error":{"message":"参考素材上传失败：单次请求不能超过 100 MiB。"}}';
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
